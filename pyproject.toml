[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memagent-local"
dynamic = ["version"]
description = "Local-first layered memory and autonomous learning engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "memagent contributors"}]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agent", "memory", "local-first", "llm", "autonomous-learning"]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
# 核心保持零依赖；各服务入口按需安装：
#   pip install memagent-local[mcp]              → MCP 服务器（memagent.mcp_server）
#   pip install memagent-local[embed-local]      → 本地语义嵌入（sentence-transformers）
#   pip install memagent-local[embed-fastembed]  → 本地 ONNX 嵌入（fastembed，轻量无 torch）
mcp = ["mcp>=1.2"]
embed-local = ["sentence-transformers>=3,<6"]
embed-fastembed = ["fastembed>=0.3"]
dev = ["pytest>=8,<10", "build>=1.2,<2", "twine>=5,<7"]

[project.scripts]
memagent = "memagent.__main__:main"
memagent-backup = "memagent.backup:main"
memagent-release = "memagent.release:main"
memagent-server = "memagent.server:main"
memagent-mcp = "memagent.mcp_server:main"

[tool.setuptools.dynamic]
version = {attr = "memagent.__version__"}

[tool.setuptools.packages.find]
include = ["memagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
