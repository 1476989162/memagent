name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev]
      - run: python -m compileall -q memagent
      - run: python -m pytest -q

  package:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev]
      - run: python -m memagent.release build --output release-artifacts
      - name: Verify and install release artifact
        shell: bash
        run: |
          wheel="$(find release-artifacts -name '*.whl' -type f -print -quit)"
          test -n "$wheel"
          python -m twine check "$wheel"
          python -m memagent.release verify --wheel "$wheel"
          python -m memagent.release install --wheel "$wheel" --runtime .ci-runtime
          python -m memagent.release run --runtime .ci-runtime -- --version
          python -m memagent.release status --runtime .ci-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: memagent-local-wheel
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
